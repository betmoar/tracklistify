[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[project]
name = "tracklistify"
version = "0.9.1"
description = "Automatic tracklist generator for DJ mixes and audio streams"
readme = "README.md"
authors = [
    { name = "betmoar", email = "<betmoar@mailsecure.me>" }
]
license = "MIT"
keywords = ["tracklistify", "youtube", "mixcloud", "shazam", "tracklist", "audio", "fingerprinting"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Utilities",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "mutagen>=1.48.1",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "yt-dlp[default]>=2026.7.4",
    "shazamio>=0.8.1",
    "click>=8.4.2",
    # audioop was removed from the stdlib in Python 3.13 (PEP 594) but pydub
    # still imports it; this maintained backport restores the symbol.
    "audioop-lts>=0.2.1 ; python_version >= '3.13'",
]

[tool.uv.sources]
# shazamio = { git = "https://github.com/shazamio/shazamio.git" }
# shazamio-core = { git = "https://github.com/shazamio/shazamio-core.git" }
# pyacrcloud = { git = "https://github.com/acrcloud/acrcloud_sdk_python.git" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-httpx>=0.35.0",
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
    "commitizen>=4.17.0",
    "pylint>=4.0.6",
    "vulture>=2.16",
    "freezegun>=1.5",
]

[project.scripts]
tracklistify = "tracklistify.cli:cli"
tracklistify-dev = "tracklistify.dev_cli.cli:cli"

[project.urls]
homepage = "https://github.com/betmoar/tracklistify"
repository = "https://github.com/betmoar/tracklistify.git"
documentation = "https://github.com/betmoar/tracklistify#readme"

[tool.bandit]
# Security pattern scan; medium+ severity blocks commits (-ll in hook args).
# Exclude tests/ (fixtures use sample creds, mock secrets, etc.).
exclude_dirs = ["tests", ".venv", "dev_cli"]
# Add specific B-codes here only after seeing them fire repeatedly with
# justified rationale. Keep this list short — every entry weakens the scan.
skips = []

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
# pep621 reads [project].version above; the previous value ("poetry") looked
# for [tool.poetry].version, which no longer exists since the uv migration —
# `cz bump` was broken.
version_provider = "pep621"
# False: `cz bump` must NOT auto-generate the changelog. Commitizen's bump
# runs the NON-incremental generator, which regenerates from
# `changelog_start_rev` and overwrites curated history (observed: it replaced
# the hand-written 0.9.0 `### Added` section with a wrong duplicate `### Fix`
# from the same range's commits). The repeatable release flow is the two-step
# `cz changelog --incremental` (adds one section, preserves the rest) then
# `cz bump` (version + commit + tag, no changelog). See docs/PLAYBOOKS.md.
update_changelog_on_bump = false
major_version_zero = true
# The oldest real release tag. 0.7.0 (the clean-slate modular restructure,
# 2025-09-15) was never tagged and the 0.8.0 tag lacked the `v` prefix
# `tag_format` requires; both were reconstructed in 2026-08 so cz sees a
# consistent v0.7.0 → HEAD chain. Pre-0.7.0 history is the pre-squash record
# (hand-curated sections below v0.7.0) and is deliberately outside cz's range.
changelog_start_rev = "v0.7.0"

[tool.pytest.ini_options]
minversion = "8.0"
# Pinned: every async test must carry @pytest.mark.asyncio. This is
# pytest-asyncio's current default, but relying on the default means a
# future release flipping it would silently start auto-collecting.
asyncio_mode = "strict"
addopts = "-ra -q -v"
testpaths = [
    "tests"
]
markers = [
    "integration: marks tests that hit live external services (skipped unless run explicitly)",
]

[tool.coverage.run]
# Only measure our package code, not tests
source = ["src"]
# Additionally, omit any test paths that might sneak in
omit = [
    "tests/*",
    "**/tests/*",
    "**/dev_cli/*",
]

[tool.coverage.report]
# Ensure tests are omitted from reporting as well
omit = [
    "tests/*",
    "**/tests/*",
    "**/dev*",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".pre-commit-config.yaml",
    ".ruff_cache",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
include = [
    "pyproject.toml",
    "src/tracklistify/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
]

# Match Black
line-length = 88

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
# E and F are for PEP8, W (pycodestyle warnings),
# I for isort, B for flake8-bugbear, ANN for type hints
select = ["E", "F", "B"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["B"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.uv]
link-mode = "copy"
