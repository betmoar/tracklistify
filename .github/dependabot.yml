# Dependabot configuration for Tracklistify.
#
# Goal: one grouped PR per week instead of N individual bump PRs.
# - minor + patch updates collapse into a single PR (the noisy churn)
# - major bumps get their own PR so they can be eyeballed individually
#   (e.g. a 20 -> 21 jump warrants a separate look)
# - yt-dlp is its own group, because a stale pin there is a total outage
#
# ONE entry per (package-ecosystem, directory, target-branch). Dependabot
# rejects the whole file if two overlap -- and a rejected file means NO
# updates at all, not just the duplicate. Per-dependency treatment therefore
# goes in `groups`, which can be as many as needed; `schedule` is per entry
# and cannot be varied per group.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      # Daily rather than weekly, for yt-dlp's sake -- see its group below.
      # The other groups still produce at most one PR per cycle each, so the
      # cost of the faster cadence is bounded.
      interval: "daily"
    groups:
      yt-dlp:
        # yt-dlp is the one dependency where falling behind IS being broken:
        # YouTube retires the player clients a pinned version reaches for, and
        # every download starts returning HTTP 403 (#91). A lock one month
        # stale took the app's primary input path out entirely, while the
        # weekly grouped PRs through that window (#82, #83, #86) carried ruff,
        # mypy and pylint and never yt-dlp.
        #
        # Why they didn't is not established -- 2026.7.4 -> 2026.8.19 reads as
        # minor and should have qualified. Splitting it out sidesteps the
        # question rather than answering it; the scheduled live probe
        # (.github/workflows/live-probes.yml) is what actually catches a miss.
        patterns: ["yt-dlp"]
      python-dependencies:
        # Everything else minor/patch rolls up into one PR.
        patterns: ["*"]
        exclude-patterns: ["yt-dlp"]
        update-types:
          - "minor"
          - "patch"
      major-bumps:
        # Major bumps stay separate for individual review.
        patterns: ["*"]
        exclude-patterns: ["yt-dlp"]
        update-types:
          - "major"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
